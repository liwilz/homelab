services:
  # Proton VPN (using custom exitpi script)
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - /etc/wireguard:/gluetun/wireguard
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_INTERFACE_VAL=wg0
      - FIREWALL=off
    restart: unless-stopped

  tailscale-exit:
    image: tailscale/tailscale:latest
    container_name: tailscale-exit
    network_mode: ${TS_NET_MODE:-service:vpn}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale-data:/var/lib/tailscale
    environment:
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-exit-node --hostname=exitpi
      - TS_STATE_DIR=/var/lib/tailscale
    restart: unless-stopped
